function vMe(){const m=Object.assign({name:S.sess.name},ME||{}),f=(i,l,t)=>`<div><label>${l}</label><input id="m_${i}" type="${t||"text"}" value="${esc(m[i]||"")}"></div>`;return`<div class="card"><h2>My details</h2><p class="m">Enter your own details. Your managers can see them.</p><div class="grid">${f("name","Full name")}${f("phone","Phone","tel")}${f("idNo","ID number")}${f("addr","Home address")}${f("licNo","Licence number")}${f("licClass","Licence class")}${f("licExp","Licence expiry","date")}${f("medExp","Medical expiry","date")}${f("kin","Next of kin")}${f("kinPh","Next of kin phone","tel")}<div class="w"><button class="btn" style="width:100%" onclick="saveMe()">Save my details</button></div></div></div>`}
async function saveMe(){const m={userId:S.sess.userId||"admin",ts:Date.now()};MEK.forEach(k=>m[k]=$("m_"+k).value.trim());try{await BE.put(base()+"/profiles/"+S.sess.uid,m);ME=m;toast("Details saved")}catch(e){toast("Not allowed")}}
function vDrv(){const ed=pm("drv")>=2,r=REM();return`${prfCard()}${r.length?`<div class="card" style="border-color:var(--o)"><h2 style="color:var(--o)">⚠ Reminders (${r.length})</h2>${r.map(x=>`<div style="padding:4px 0;border-top:1px solid var(--line)"><b>${esc(x.d.name)}</b> · ${x.k}: ${x.v} ${chip(x.n)}</div>`).join("")}</div>`:""}<div class="card"><h2>Driver management (${DR.length})</h2>${ed?`<div class="bar"><button class="btn" onclick="drvForm(0)">＋ Add driver</button><button class="btn g" onclick="drvFromTrips()">Add drivers found in reports</button></div>`:""}${DR.length?tbl(["No.","Name","Phone","Licence no.","Licence expiry","Medical expiry","Documents",""],DR.sort((a,b)=>a.no-b.no).map(d=>({cells:[d.no,`<b>${esc(d.name)}</b>${d.active===false?' <small class="m">(inactive)</small>':""}`,esc(d.phone||""),esc(d.licNo||""),(d.licExp||"—")+" "+chip(dleft(d.licExp)),(d.medExp||"—")+" "+chip(dleft(d.medExp)),(d.hasLic?`<a style="cursor:pointer" onclick="viewDoc(${d.no},'lic')">📄 Licence</a> `:"")+(d.hasMed?`<a style="cursor:pointer" onclick="viewDoc(${d.no},'med')">📄 Medical</a>`:"")||"—",ed?`<a style="cursor:pointer" onclick="drvForm(${d.no})">Edit</a>`:""]}))):'<p class="m">No drivers yet.</p>'}</div>`}
function drvForm(no){const d=DR.find(x=>x.no===no)||{},f=(i,l,t,v)=>`<div><label>${l}</label><input id="d_${i}" type="${t||"text"}" value="${esc(v||"")}"></div>`;$("modal").innerHTML=`<div class="card" style="max-width:520px;margin:4vh auto"><h2>${no?"Driver no. "+no:"New driver"}</h2><div class="grid">${f("name","Full name","text",d.name)}${f("phone","Phone","tel",d.phone)}${f("idNo","ID number","text",d.idNo)}${f("licNo","Licence number","text",d.licNo)}${f("licClass","Licence class","text",d.licClass)}${f("licExp","Licence expiry","date",d.licExp)}${f("medExp","Medical expiry","date",d.medExp)}<div><label>Status</label><select id="d_active"><option value="1">Active</option><option value="0"${d.active===false?" selected":""}>Inactive</option></select></div><div class="w"><label>Notes</label><input id="d_notes" value="${esc(d.notes||"")}"></div><div class="w"><label>Licence (PDF, max 600 KB)${d.hasLic?" · already saved":""}</label><input id="d_lic" type="file" accept="application/pdf"></div><div class="w"><label>Medical certificate (PDF, max 600 KB)${d.hasMed?" · already saved":""}</label><input id="d_med" type="file" accept="application/pdf"></div></div><div class="bar" style="margin-top:12px"><button class="btn" onclick="saveDrv(${no||0})">Save</button><button class="btn g" onclick="$('modal').innerHTML=''">Cancel</button>${no?`<button class="btn g" onclick="delDrv(${no})">Delete</button>`:""}</div></div>`}
const b64=f=>new Promise((ok,no)=>{const r=new FileReader();r.onload=()=>ok(r.result);r.onerror=no;r.readAsDataURL(f)});
async function saveDrv(no){const g=i=>$("d_"+i).value.trim();if(!g("name"))return toast("Enter the driver's name");const old=DR.find(x=>x.no===no)||{},n=no||Math.max(0,...DR.map(x=>x.no))+1,d={...old,no:n,name:g("name"),phone:g("phone"),idNo:g("idNo"),licNo:g("licNo"),licClass:g("licClass"),licExp:g("licExp"),medExp:g("medExp"),notes:g("notes"),active:$("d_active").value==="1"};
try{for(const[k,i]of[["lic","d_lic"],["med","d_med"]]){const f=$(i).files[0];if(!f)continue;if(f.size>614400)return toast(f.name+" is over 600 KB. Please shrink the PDF.");await BE.put(base()+"/driverDocs/"+n+"_"+k,{name:f.name,data:await b64(f),ts:Date.now()});d[k==="lic"?"hasLic":"hasMed"]=true}
await BE.put(base()+"/drivers/"+n,d);$("modal").innerHTML="";await loadCo();render();toast("Driver saved")}catch(e){toast("Could not save: "+(e.message==="DENIED"?"no permission":e.message))}}
async function delDrv(no){if(!confirm("Delete this driver and documents?"))return;try{await BE.del(base()+"/drivers/"+no);await BE.del(base()+"/driverDocs/"+no+"_lic");await BE.del(base()+"/driverDocs/"+no+"_med");$("modal").innerHTML="";await loadCo();render()}catch(e){toast("Not allowed")}}
async function viewDoc(no,k){try{const d=await BE.get(base()+"/driverDocs/"+no+"_"+k);if(!d)return toast("Document not found");const bin=atob(d.data.split(",")[1]),u=new Uint8Array(bin.length);for(let i=0;i<bin.length;i++)u[i]=bin.charCodeAt(i);saveFile(d.name||k+".pdf",new Blob([u],{type:"application/pdf"}))}catch(e){toast("Could not open the document")}}
async function drvFromTrips(){const have=new Set(DR.map(d=>d.name.toLowerCase())),names=[...new Set(DB.trips.map(t=>t.drv))].filter(n=>n&&!/unknown/i.test(n)&&!have.has(n.toLowerCase()));if(!names.length)return toast("No new driver names in your reports");let n=Math.max(0,...DR.map(d=>d.no));try{for(const nm of names){n++;await BE.put(base()+"/drivers/"+n,{no:n,name:nm,active:true})}await loadCo();render();toast(names.length+" drivers added")}catch(e){toast("Not allowed")}}
/* ----- staff & rights ----- */
function vStf(){const rows=Object.entries(ST),me=S.sess.uid,cus=x=>JSON.stringify(x.perm||PRESET[x.level])!==JSON.stringify(PRESET[x.level]);return`<div class="card"><h2>Share with your workers</h2><p class="m">Workers sign in with your Company ID, their Worker ID and the password you set.</p><div class="big">${S.cid}</div></div>
<div class="card"><h2>Create a worker login</h2><form onsubmit="addStaff(event)"><div class="grid"><div><label>Worker ID</label><input id="su" required placeholder="tendai.m"></div><div><label>Full name</label><input id="sn"></div><div><label>Password</label><input id="sp" type="text" required minlength="6"></div><div><label>Start from level</label><select id="sl">${Object.keys(LV).filter(k=>k!=="owner").map(k=>`<option value="${k}">${LV[k].n}</option>`).join("")}</select></div><div class="w"><label>Limit to one vehicle (optional, for drivers)</label><select id="su2"><option value="">All vehicles</option>${Object.keys(DB.assets).map(r=>`<option>${esc(r)}</option>`).join("")}</select></div><div class="w"><button class="btn" style="width:100%">Create login</button></div></div></form><p class="m" style="margin-top:10px">${Object.keys(LV).map(k=>`<b>${LV[k].n}:</b> ${LV[k].d}`).join("<br>")}<br>After creating a login, tap <b>Rights</b> to fine-tune what each person can see or edit.</p></div>
<div class="card"><h2>Workers (${rows.length})</h2>${tbl(["Worker","Level","Rights","Status",""],rows.map(([u,x])=>({cells:[`<b>${esc(x.name)}</b><br><small class="m">${esc(x.userId)}</small>`,u===me?LV[x.level].n:`<select onchange="stf('${u}','level',this.value)">${Object.keys(LV).map(k=>`<option value="${k}"${k===x.level?" selected":""}>${LV[k].n}</option>`).join("")}</select>`,u===me?"All":`<a style="cursor:pointer" onclick="rights('${u}')">Rights${cus(x)?" (custom)":""}</a>`,`<span class="sp ${x.active?"active":"suspended"}">${x.active?"active":"disabled"}</span>`,u===me?"":`<a style="cursor:pointer;margin-right:10px" onclick="stf('${u}','active',${!x.active})">${x.active?"Disable":"Enable"}</a><a style="cursor:pointer" onclick="stf('${u}','del')">✕</a>`]})))}</div>`}
function rights(uid){const x=ST[uid],p=x.perm||PRESET[x.level]||PRESET.viewer,opt=k=>(k==="dl"?[[0,"No"],[1,"Yes"]]:[[0,"None"],[1,"View only"],[2,"View and edit"]]);$("modal").innerHTML=`<div class="card" style="max-width:480px;margin:4vh auto"><h2>Rights: ${esc(x.name)}</h2><label>Fill from a level</label><select id="rl" onchange="rlFill(this.value)">${Object.keys(LV).filter(k=>k!=="owner").map(k=>`<option value="${k}"${k===x.level?" selected":""}>${LV[k].n}</option>`).join("")}</select><div class="grid" style="margin-top:8px">${MODS.map(([k,l])=>`<div><label>${l}</label><select id="rm_${k}">${opt(k).map(([v,t])=>`<option value="${v}"${(p[k]||0)===v?" selected":""}>${t}</option>`).join("")}</select></div>`).join("")}</div><label>Limit to one vehicle</label><select id="rv"><option value="">All vehicles</option>${Object.keys(DB.assets).map(r=>`<option${r===x.veh?" selected":""}>${esc(r)}</option>`).join("")}</select><div class="bar" style="margin-top:12px"><button class="btn" onclick="saveRights('${uid}')">Save rights</button><button class="btn g" onclick="$('modal').innerHTML=''">Cancel</button></div></div>`}
function rlFill(l){MODS.forEach(([k])=>$("rm_"+k).value=PRESET[l][k])}
async function saveRights(uid){const perm={};MODS.forEach(([k])=>perm[k]=+$("rm_"+k).value);const lvl=$("rl").value;try{const vh=$("rv").value;await BE.put("users/"+uid+"/veh",vh);await BE.put(base()+"/staff/"+uid+"/veh",vh);await BE.put("users/"+uid+"/level",lvl);await BE.put("users/"+uid+"/perm",perm);await BE.put(base()+"/staff/"+uid+"/level",lvl);await BE.put(base()+"/staff/"+uid+"/perm",perm);$("modal").innerHTML="";await loadCo();render();toast("Rights saved")}catch(e){toast("Not allowed")}}
/* ----- workspace ----- */
const TABM={live:"live",dash:"dash",ast:"ast",veh:"veh",trp:"trp",drv:"drv",drp:"drp",flt:"flt",led:"led",rat:"rat",rep:"rep",stf:"stf",me:"me"};
function renderWS(){const s=S.sess,co=s.company||{},T=Object.keys(TABM).filter(k=>pm(TABM[k])>=1);if(!T.length){$("app").innerHTML='<main><div class="card hero"><h1>No access yet</h1><p class="m">Ask your company owner to give you rights.</p><button class="btn g" onclick="logout()">Sign out</button></div></main>';return}if(!T.includes(tab))tab=T[0];
const V={me:vMe,live:vLive,dash:vDash,ast:vAst,veh:vVeh,trp:vTrp,drv:vDrv,drp:vDrp,flt:vFlt,led:vLed,rat:vRat,rep:vRep,stf:vStf},regs=Object.keys(DB.assets),has=regs.length&&DB.trips.some(t=>DB.assets[t.reg]),dataTabs=["dash","veh","trp","drp","rep"],always=["me","live","drv","flt","led","rat","stf"],rn=REM().length;
const hero=`<div class="card hero"><h1>${regs.length?"Import your first report":"Add your fleet"}</h1><p class="m">${can("import")?"Add the assets you want to track, then import a Daily Movement Report (.xlsx or .csv).":"No data yet. A Manager or Owner needs to import a report."}</p>${can("import")?`<button class="btn" onclick="$('fi').click()">⬆ Import a report</button> <button class="btn g" onclick="tab='flt';render()">Add assets</button> ${typeof SAMPLE!=="undefined"&&SAMPLE?`<button class="btn g" onclick="loadSample()">Try the sample report</button>`:""}`:""}</div>`;
$("app").innerHTML=`<header><div class="logo"><i>₣</i><div><b>${esc(co.name||"FMS")}</b><small>${S.cid} · ${esc(s.name)} · ${LV[s.level].n}</small></div></div><div class="bar" style="margin:0">${s.role==="admin"?'<button class="btn g" onclick="back()">← Admin</button>':""}<button class="btn g" onclick="logout()">Sign out</button></div></header><nav>${T.map(k=>`<button class="${k===tab?"on":""}" onclick="tab='${k}';render()">${TN[k]}${k==="drv"&&rn?" ⚠"+rn:""}</button>`).join("")}</nav><main>${LIVE?"":'<p class="m"><small>DEMO MODE · data stays in this browser</small></p>'}
${dataTabs.includes(tab)?`<div class="bar"><select onchange="vf=this.value;render()"><option value="">All vehicles</option>${regs.map(r=>`<option${r===vf?" selected":""}>${esc(r)}</option>`).join("")}</select><input type="date" value="${from}" onchange="from=this.value;render()" aria-label="From"><input type="date" value="${to}" onchange="to=this.value;render()" aria-label="To">${can("import")?'<button class="btn" onclick="$(\'fi\').click()">⬆ Import report</button>':""}</div>`:""}${always.includes(tab)||(["ast"].includes(tab)?regs.length:has)?V[tab]():hero}</main>`;if(tab==="live")initMap();else if(MAP){try{MAP.remove()}catch(e){}MAP=null}}
$("fi").onchange=e=>{const f=e.target.files[0];e.target.value="";f&&doImport(f)};
init();if("serviceWorker" in navigator)navigator.serviceWorker.register("sw.js").catch(()=>{});
</script></body></html>
